name: Main
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run test
  docker:
    if: github.ref == 'refs/heads/daddy' || github.ref == 'refs/heads/bottom'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "DOCKER_TAG=bottom" >> $GITHUB_ENV
        if: github.ref == 'refs/heads/bottom'
      - run: echo "DOCKER_TAG=latest" >> $GITHUB_ENV
        if: github.ref == 'refs/heads/daddy'
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: chrissx/kinkcheck.top:$DOCKER_TAG
